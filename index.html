<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSCP Amy's House Inventory</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b3b2c">
    
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#fcfbf9] text-gray-800 antialiased min-h-screen flex flex-col">

    <header class="bg-[#0b3b2c] text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <img src="logo.png" alt="MSCP" class="w-10 h-10 object-contain rounded-md bg-white/10 p-1">
                <div>
                    <h1 class="font-bold text-lg leading-tight">Amy's House Store</h1>
                    <p id="user-display-role" class="text-xs text-[#e85d04] font-medium tracking-wider uppercase">MSCP Inventory System</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <span id="sync-status" class="text-xs bg-green-700/60 px-2 py-1 rounded text-emerald-100">Online</span>
                <button id="logout-btn" style="display: none;" class="text-xs underline hover:text-[#e85d04]">Logout</button>
            </div>
        </div>
    </header>

    <!-- Clean Department Code Login Screen -->
    <main id="auth-section" class="flex-grow flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-xl shadow-lg border border-gray-100 w-full max-w-md">
            <h2 class="text-2xl font-bold text-[#0b3b2c] mb-1 text-center">System Login</h2>
            <p class="text-xs text-gray-500 mb-6 text-center">Enter your Department Code & Staff Name</p>
            
            <div id="login-error-box" style="display: none;" class="mb-4 text-xs bg-red-50 text-red-700 p-3 rounded border border-red-200"></div>

            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Department Code</label>
                    <select id="auth-dept-code" required class="w-full p-2.5 border rounded text-sm bg-gray-50 focus:ring-2 focus:ring-[#0b3b2c] outline-none">
                        <option value="">Select Department Code...</option>
                        <option value="AD001">AD001 - Executive Admin (Dorothy)</option>
                        <option value="ST001">ST001 - Central Store (Amy's House)</option>
                        <option value="FC001">FC001 - Family Care Department</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Your Name (Operator)</label>
                    <input type="text" id="auth-staff-name" required placeholder="e.g. Dorothy, Edward, Paul" class="w-full p-2 border rounded text-sm outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Department Password / PIN</label>
                    <input type="password" id="auth-password" required placeholder="••••••••" class="w-full p-2 border rounded text-sm outline-none">
                </div>

                <button type="submit" id="login-submit-btn" class="w-full bg-[#e85d04] hover:bg-[#d05203] text-white font-bold py-2.5 rounded shadow transition">
                    Access Department
                </button>
            </form>
        </div>
    </main>

    <!-- Main Workspace -->
    <main id="dashboard-section" style="display: none;" class="flex-grow max-w-7xl w-full mx-auto p-4 grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Left: Record Movement Form -->
        <section class="bg-white p-5 rounded-xl shadow-sm border border-emerald-900/10 lg:col-span-1 h-fit">
            <h2 class="text-md font-bold text-[#0b3b2c] mb-4 border-b pb-2">Record Movement</h2>
            <form id="movement-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Movement Type</label>
                    <select id="movement_type" required class="w-full p-2 border rounded text-sm bg-gray-50">
                        <option value="">Choose...</option>
                        <option value="Purchase">Purchase (In)</option>
                        <option value="Donation">Donation (In)</option>
                        <option value="Weekly supply">Weekly supply (Out)</option>
                        <option value="Top-up">Top-up (Out)</option>
                        <option value="Issue to department">Issue to dept (Out)</option>
                    </select>
                </div>

                <div id="donation-fields" style="display: none;" class="space-y-3 bg-orange-50 p-3 rounded border border-orange-100">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600">Donor</label>
                        <select id="donor_id" class="w-full p-2 border rounded text-sm"><option value="">Select Donor...</option></select>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-semibold text-gray-600">Ref No.</label>
                            <input type="text" id="donation_ref" placeholder="e.g. AH/DR/001" class="w-full p-2 border rounded text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600">Condition</label>
                            <select id="item_condition" class="w-full p-2 border rounded text-sm">
                                <option value="Good">Good</option>
                                <option value="Fair">Fair</option>
                                <option value="Damaged">Damaged</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Item</label>
                    <select id="item_id" required class="w-full p-2 border rounded text-sm bg-gray-50"><option value="">Loading...</option></select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Whose Stock / Earmark</label>
                    <select id="department_id" required class="w-full p-2 border rounded text-sm bg-gray-50"><option value="">Loading...</option></select>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Direction</label>
                        <select id="direction" required class="w-full p-2 border rounded text-sm bg-gray-50">
                            <option value="In">In (+)</option>
                            <option value="Out">Out (-)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Quantity</label>
                        <input type="number" id="quantity" step="0.01" min="0.01" required placeholder="0" class="w-full p-2 border rounded text-sm">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Reason / Notes</label>
                    <input type="text" id="reason" placeholder="e.g. Baking / Children returned" class="w-full p-2 border rounded text-sm">
                </div>

                <button type="submit" class="w-full bg-[#0b3b2c] hover:bg-[#07281c] text-white font-medium p-2.5 rounded shadow transition">Save Movement</button>
            </form>
        </section>

        <!-- Right: Live Balances -->
        <section class="lg:col-span-2 space-y-6">
            <div class="bg-white p-5 rounded-xl shadow-sm border border-emerald-900/10">
                <h2 class="text-md font-bold text-[#0b3b2c] mb-3">Live Stock Balances</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-emerald-50 text-[#0b3b2c] text-xs uppercase border-b border-emerald-100">
                            <tr>
                                <th class="p-2.5">Item</th>
                                <th class="p-2.5">Department</th>
                                <th class="p-2.5">Balance</th>
                                <th class="p-2.5">Status</th>
                            </tr>
                        </thead>
                        <tbody id="balances-table-body" class="divide-y divide-gray-100"></tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
